<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>📚 BrightFuture — Student Registration</title>
    <link rel="stylesheet" href="styles.css"/>
    <style>
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: opacity 0.5s, visibility 0.5s;
            opacity: 1;
            visibility: visible;
        }

        .toast.error {
            background-color: #dc3545;
        }

        .toast.hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>
<h2>📚 BrightFuture — Student Registration</h2>

<form id="studentForm" novalidate>
    <fieldset>
        <legend>📅 Admission Information</legend>

        <label>Date of Admission *</label>
        <input type="date" id="dateOfAdmission" name="admission.dateOfAdmission" required />

        <label>Class *</label>
        <input type="text" id="className" name="admission.className" required
               pattern="^[A-Za-z0-9\s]+$" title="Only letters and numbers allowed" />

        <label>Gender *</label>
        <select id="gender" name="admission.gender" required>
            <option value="">Select</option>
            <option value="Boy">Boy</option>
            <option value="Girl">Girl</option>
        </select>

        <label>Date of Birth *</label>
        <input type="date" id="dob" name="admission.dob" required />

        <label>Age</label>
        <input type="number" id="age" name="admission.age" min="3" max="25" readonly placeholder="Auto-calculated"  />

        <label>Place of Birth</label>
        <input type="text" id="placeOfBirth" name="admission.placeOfBirth"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Residential *</label>
        <select id="residential" name="admission.residential" required>
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Remark</label>
        <input type="text" id="remark" name="admission.remark" />

        <label>SATS No</label>
        <input type="text" id="satsNo" name="admission.satsNo"
               pattern="^\d{9}$" title="Enter exactly 9 digits"
               placeholder="Enter 6–10 digit PIN" />

        <label>PIN No</label>
        <input type="text" id="penNo" name="admission.penNo"
               pattern="^\d{6,10}$"
               title="Enter 6–10 digits"
               placeholder="Enter 6–10 digit PIN" />

        <label>UDISE TC Status</label>
        <input type="text" id="udiseTcStatus" name="admission.udiseTcStatus" />

        <label>TC In Date</label>
        <input type="date" id="tcInDate" name="admission.tcInDate" />

        <label>TC Received</label>
        <input type="text" id="tcReceived" name="admission.tcReceived" />

        <label>School Place</label>
        <input type="text" id="schoolPlace" name="admission.schoolPlace"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />
    </fieldset>

    <fieldset>
        <legend>🆔 Student Aadhaar Information</legend>

        <label>Student Name *</label>
        <input type="text" id="studentName" name="aadharInfo.studentName" required
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Student Aadhaar No *</label>
        <input type="text" id="studentAadharNo" name="aadharInfo.studentAadharNo" required
               placeholder="XXXX-XXXX-XXXX"
               pattern="^\d{4}-\d{4}-\d{4}$" title="Enter Aadhaar as XXXX-XXXX-XXXX" />
    </fieldset>

    <fieldset>
        <legend>👨‍👩‍👧‍👦 Parents Information</legend>

        <h4>👨 Father</h4>
        <label>Name *</label>
        <input type="text" id="fatherName" name="parents.father.name" required
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Aadhaar No *</label>
        <input type="text" id="fatherAadhar" name="parents.father.aadharNo" required
               placeholder="XXXX-XXXX-XXXX"
               pattern="^\d{4}-\d{4}-\d{4}$" title="Enter Aadhaar as XXXX-XXXX-XXXX" />

        <label>Occupation</label>
        <input type="text" id="fatherOccupation" name="parents.father.occupation"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Annual Income</label>
        <input type="number" id="fatherAnnualIncome" name="parents.father.annualIncome" min="0"/>

        <h4>👩 Mother</h4>
        <label>Name *</label>
        <input type="text" id="motherName" name="parents.mother.name" required
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Aadhaar No *</label>
        <input type="text" id="motherAadhar" name="parents.mother.aadharNo" required
               placeholder="XXXX-XXXX-XXXX"
               pattern="^\d{4}-\d{4}-\d{4}$" title="Enter Aadhaar as XXXX-XXXX-XXXX" />

        <label>Occupation</label>
        <input type="text" id="motherOccupation" name="parents.mother.occupation"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <h4>🛡 Guardian</h4>
        <label>Name</label>
        <input type="text" id="guardianName" name="parents.guardian.name"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Contact No</label>
        <input type="text" id="guardianContact" name="parents.guardian.contactNo"
               placeholder="XXX-XXX-XXXX"
               pattern="^\d{3}-\d{3}-\d{4}$" title="Enter phone as XXX-XXX-XXXX" />
    </fieldset>

    <fieldset>
        <legend>🌍 Personal Details</legend>

        <label>Nationality</label>
        <input type="text" id="nationality" name="personalDetails.nationality"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Caste</label>
        <input type="text" id="caste" name="personalDetails.caste"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Scheduled Category</label>
        <input type="text" id="scheduledCategory" name="personalDetails.scheduledCategory"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>No. of Dependents</label>
        <input type="number" id="noOfDependents" name="personalDetails.noOfDependents" min="0" max="20"/>

        <label>Mother Tongue</label>
        <input type="text" id="motherTongue" name="personalDetails.motherTongue"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <label>Disability</label>
        <select id="disabilityStatus" name="personalDetails.disability.status">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
        </select>

        <div id="disabilityExtra" class="hidden">
            <label>Disability Type *</label>
            <input type="text" id="disabilityType" name="personalDetails.disability.type"
                   pattern="^[A-Za-z\s]+$" title="Only letters allowed" />
        </div>
    </fieldset>

    <fieldset>
        <legend>🏠 Address</legend>

        <h4>Parents Address</h4>
        <input type="text" id="parentVillage" name="address.parentsAddress.village" placeholder="Village"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="parentTaluk" name="address.parentsAddress.taluk" placeholder="Taluk"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="parentDistrict" name="address.parentsAddress.district" placeholder="District"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="parentPin" name="address.parentsAddress.pin" placeholder="PIN Code"
               pattern="^\d{6}$" title="Enter 6 digits" />

        <input type="text" id="parentContact" name="address.parentsAddress.contactNo" placeholder="Contact No"
               pattern="^\d{3}-\d{3}-\d{4}$" title="Enter phone as XXX-XXX-XXXX" />

        <h4>Guardian Address</h4>
        <input type="text" id="guardianVillage" name="address.guardianAddress.village" placeholder="Village"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="guardianTaluk" name="address.guardianAddress.taluk" placeholder="Taluk"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="guardianDistrict" name="address.guardianAddress.district" placeholder="District"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="guardianPin" name="address.guardianAddress.pin" placeholder="PIN Code"
               pattern="^\d{6}$" title="Enter 6 digits" />

        <input type="text" id="guardianAddressContact" name="address.guardianAddress.contactNo" placeholder="Contact No"
               pattern="^\d{3}-\d{3}-\d{4}$" title="Enter phone as XXX-XXX-XXXX" />
    </fieldset>

    <fieldset>
        <legend>🏫 Previous School</legend>

        <label>School Name</label>
        <input type="text" id="prevSchoolName" name="previousSchool.schoolName"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <h4>School Address</h4>
        <input type="text" id="prevSchoolVillage" name="previousSchool.address.village" placeholder="Village"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="prevSchoolTaluk" name="previousSchool.address.taluk" placeholder="Taluk"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="prevSchoolDistrict" name="previousSchool.address.district" placeholder="District"
               pattern="^[A-Za-z\s]+$" title="Only letters allowed" />

        <input type="text" id="prevSchoolPin" name="previousSchool.address.pin" placeholder="PIN Code"
               pattern="^\d{6}$" title="Enter 6 digits" />

        <input type="text" id="prevSchoolContact" name="previousSchool.address.contactNo" placeholder="Contact No"
               pattern="^\d{3}-\d{3}-\d{4}$" title="Enter phone as XXX-XXX-XXXX" />
    </fieldset>

    <div class="buttons">
        <button id="submitBtn" type="submit">✅ Submit</button>
    </div>
</form>

<div id="toast" class="toast hidden"></div>

<script>
    // Helper function to convert dot-notation form data into a nested object
    function formToNestedObject(formData) {
        const data = {};
        for (let [key, value] of formData.entries()) {
            const parts = key.split('.');
            let current = data;
            while (parts.length > 1) {
                const part = parts.shift();
                if (!current[part]) {
                    current[part] = {};
                }
                current = current[part];
            }
            current[parts[0]] = value;
        }
        return data;
    }

    function showToast(message, isSuccess = true) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.remove("hidden", "error");
        if (!isSuccess) {
            toast.classList.add("error");
        }
        setTimeout(() => toast.classList.add("hidden"), 3000);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("studentForm");
        const dobInput = document.getElementById("dob");
        const ageInput = document.getElementById("age");

        // Calculate age automatically
        dobInput.addEventListener('change', () => {
            const dob = new Date(dobInput.value);
            const today = new Date();
            const age = today.getFullYear() - dob.getFullYear();
            ageInput.value = age;
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            // TEMPORARILY REMOVE VALIDATION FOR DEBUGGING
            // if (!form.checkValidity()) {
            //     showToast("Please fill out all required fields.", false);
            //     return;
            // }

            const formData = new FormData(form);
            const requestBody = formToNestedObject(formData);

            // Log the JSON to verify the structure before sending
            console.log("Sending JSON:", JSON.stringify(requestBody, null, 2));

            fetch("http://localhost:9090/students", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(requestBody),
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    // Log the full error to the console
                    return response.text().then(text => {
                        console.error("Server responded with:", text);
                        throw new Error(text)
                    });
                }
            })
            .then(data => {
                showToast("✅ Form submitted successfully!");
                form.reset();
            })
            .catch(error => {
                console.error("Error submitting form:", error);
                showToast("❌ An error occurred. Check the console for details.", false);
            });
        });
    });
</script>
</body>
</html>
