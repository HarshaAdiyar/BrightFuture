<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fetch Student by ID - Rural Public School Diddige</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Navbar -->
<header class="bg-blue-800 text-white shadow-md">
    <div class="container mx-auto flex justify-between items-center py-4 px-6">
        <div class="flex items-center">
            <img src="assets/logo.png" alt="Logo" class="h-10 mr-2" />
            <h1 class="text-2xl font-bold">Rural Public School Diddige</h1>
        </div>
        <nav class="space-x-6">
            <a href="home.html" class="hover:underline">Home</a>
            <a href="register.html" class="hover:underline">Register</a>
            <a href="display.html" class="hover:underline">Display</a>
        </nav>
    </div>
</header>

<!-- Hero Section -->
<section class="relative bg-cover bg-center h-[80vh]" style="background-image: url('assets/second.png');">
    <div class="absolute top-[10%] left-0 right-0 max-w-4xl mx-auto bg-blue-800 bg-opacity-70 rounded-lg flex flex-col items-center justify-center text-white text-center px-8 py-8">
        <h2 class="text-3xl md:text-4xl font-bold mb-4">Welcome to Student Registration Portal</h2>
        <p class="mb-6 text-lg">Manage student registrations easily and efficiently</p>
        <div class="space-x-4">
            <a href="register.html" class="bg-green-500 hover:bg-green-600 px-6 py-2 rounded text-white">Register</a>
            <a href="display.html" class="bg-blue-500 hover:bg-blue-600 px-6 py-2 rounded text-white">Display All</a>
        </div>
    </div>
</section>

<!-- Section: Fetch Student by ID -->
<section class="text-center py-10 bg-white shadow-md max-w-6xl mx-auto rounded-lg mt-8 px-6">
    <h3 class="text-2xl font-bold text-blue-800 mb-6">Fetch Student by ID</h3>

    <form id="fetchStudentForm" class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <input type="text" id="studentIdInput" placeholder="Enter Student ID" required class="border border-gray-300 rounded px-4 py-2 w-full sm:w-auto focus:outline-none focus:ring-2 focus:ring-blue-600" />
        <button type="submit" class="bg-blue-600 text-white rounded px-6 py-2 hover:bg-blue-700 transition">Get Details</button>
    </form>

    <div id="studentDetails" class="mt-6 hidden overflow-x-auto bg-gray-50 border border-gray-300 rounded p-4 text-left">
        <h4 class="font-bold text-lg mb-4">Student Details</h4>
        <table class="min-w-full table-auto text-sm whitespace-nowrap">
            <tbody id="studentDetailsTable" class="divide-y divide-gray-200">
            <!-- Filled dynamically -->
            </tbody>
        </table>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      const apiUrl = 'http://localhost:8080/api/student/';

      const fetchStudentForm = document.getElementById('fetchStudentForm');
      const studentIdInput = document.getElementById('studentIdInput');
      const studentDetailsDiv = document.getElementById('studentDetails');
      const studentDetailsTable = document.getElementById('studentDetailsTable');

      function addRow(label, value) {
        return `
          <tr>
            <td class="font-semibold pr-4 py-1">${label}</td>
            <td class="py-1">${value !== undefined && value !== null && value !== '' ? value : 'N/A'}</td>
          </tr>
        `;
      }

      async function fetchStudentById(studentId) {
        try {
          const response = await fetch(apiUrl + encodeURIComponent(studentId));  // encode to avoid URL issues
          if (!response.ok) throw new Error('Student not found');

          const student = await response.json();
          const admission = student.admission || {};
          const aadhar = student.aadharInfo || {};
          const personal = student.personalDetails || {};
          const disability = personal.disability || {};
          const father = student.parents?.father || {};
          const mother = student.parents?.mother || {};
          const guardian = student.parents?.guardian || {};
          const school = student.previousSchool || {};
          const address = school.address || {};

          let rows = '';
          rows += addRow('Student ID', student.studentId);
          rows += addRow('Name', aadhar.studentName);
          rows += addRow('Aadhar No', aadhar.studentAadharNo);
          rows += addRow('RD No', aadhar.studentRdNo);
          rows += addRow('DOB', admission.dob);
          rows += addRow('Gender', admission.gender);
          rows += addRow('Class', admission.class);
          rows += addRow('Place of Birth', admission.placeOfBirth);
          rows += addRow('Residential', admission.residential);
          rows += addRow('Remark', admission.remark);
          rows += addRow('SATS No', admission.satsNo);
          rows += addRow('PEN No', admission.penNo);
          rows += addRow('UDISE TC Status', admission.udiseTcStatus);
          rows += addRow('TC In Date', admission.tcInDate);
          rows += addRow('TC Received', admission.tcReceived);
          rows += addRow('School Place', admission.schoolPlace);
          rows += addRow('Nationality', personal.nationality);
          rows += addRow('Caste', personal.caste);
          rows += addRow('Scheduled Category', personal.scheduledCategory);
          rows += addRow('Mother Tongue', personal.motherTongue);
          rows += addRow('Disability Status', disability.status);
          rows += addRow('Disability Type', disability.type);
          rows += addRow('Father Name', father.name);
          rows += addRow('Father Aadhar', father.aadharNo);
          rows += addRow('Father Occupation', father.occupation);
          rows += addRow('Father Income', father.annualIncome);
          rows += addRow('Mother Name', mother.name);
          rows += addRow('Mother Aadhar', mother.aadharNo);
          rows += addRow('Mother Occupation', mother.occupation);
          rows += addRow('Guardian Name', guardian.name);
          rows += addRow('Guardian Contact', guardian.contactNo);
          rows += addRow('Prev School Name', school.schoolName);
          rows += addRow('Village', address.village);
          rows += addRow('Taluk', address.taluk);
          rows += addRow('District', address.district);
          rows += addRow('PIN', address.pin);
          rows += addRow('School Contact', address.contactNo);

          studentDetailsTable.innerHTML = rows;
          studentDetailsDiv.classList.remove('hidden');
        } catch (error) {
          alert('Error: ' + error.message);
          studentDetailsDiv.classList.add('hidden');
        }
      }

      fetchStudentForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const studentId = studentIdInput.value.trim();
        if (studentId) {
          fetchStudentById(studentId);
        } else {
          alert('Please enter a valid student ID');
        }
      });
    });
</script>

</body>
</html>
